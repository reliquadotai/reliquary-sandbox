name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.15"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.10"
          python-version: "3.12.15"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Check Python socket support
        run: uv run python -c 'import socket, sys; assert sys.version_info[:3] == (3, 12, 15); assert hasattr(socket, "AF_VSOCK")'
      - name: Install busybox (the bash runner tests run its scripts)
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - run: uv run ruff check .
      - name: Check scoring process compatibility
        run: |
          uv run pytest -q \
            tests/test_bridge_grading.py::test_the_scoring_process_holds_no_fd_but_its_pipe_and_keeps_its_limits \
            tests/test_bridge_grading.py::test_the_scoring_process_has_no_network_but_unix_sockets \
            tests/test_bridge_grading.py::test_the_network_filter_allows_only_unix_sockets_on_its_own_abi \
            tests/test_bridge_grading.py::test_an_env_module_the_forkserver_preloaded_is_not_imported_again \
            tests/test_bridge_grading.py::test_a_scoring_process_without_its_network_filter_refuses_to_score \
            tests/test_bridge_grading.py::test_a_forkserver_dying_while_scoring_is_ours
      - id: unit_tests
        run: uv run pytest -q -m "not live" --junitxml="${{ runner.temp }}/pytest-results.xml" -o junit_logging=no -o junit_log_passing_tests=false
      - run: uv build
      - name: Check runtime installer syntax
        run: bash -n scripts/bootstrap-runtime.sh

      - name: Retain test counts
        if: always()
        uses: ./.github/actions/test-summary
        with:
          junit-path: ${{ runner.temp }}/pytest-results.xml
          test-outcome: ${{ steps.unit_tests.outcome }}

  runtime:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.15"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.10"
          python-version: "3.12.15"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Install and register pinned gVisor
        run: sudo ./scripts/bootstrap-runtime.sh --configure-docker
      - name: Build approved guest
        run: docker build --target guest -t reliquary-sandbox-guest:0.1.0 .
      - name: Exercise real sandbox lifecycle through the SDK
        id: unit_tests
        env:
          RUN_SANDBOX_LIVE: "1"
        run: uv run pytest -q -m live tests/test_live.py --junitxml="${{ runner.temp }}/pytest-results.xml" -o junit_logging=no -o junit_log_passing_tests=false
      - name: Build controller image
        run: docker build --target controller -t reliquary-sandbox-controller:0.1.0 .
      - name: Start Compose deployment
        run: |
          umask 077
          python3 - <<'PY'
          import json
          import secrets
          from pathlib import Path
          Path(".env").write_text("RELIQUARY_SANDBOX_TOKENS=" + json.dumps({"checks": secrets.token_urlsafe(32)}) + "\n")
          PY
          docker compose up -d --no-build --wait --wait-timeout 60
          curl --fail --silent http://127.0.0.1:8000/readyz
      - name: Stop Compose deployment
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down --volumes
          fi
      - name: Retain test counts
        if: always()
        uses: ./.github/actions/test-summary
        with:
          junit-path: ${{ runner.temp }}/pytest-results.xml
          test-outcome: ${{ steps.unit_tests.outcome }}

  signed-episodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: /opt/reliquary-sandbox-checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare a checkout readable by dedicated scoring identities
        working-directory: ${{ github.workspace }}
        run: |
          umask 022
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /opt/reliquary-sandbox-checks
          git archive HEAD | tar -x -C /opt/reliquary-sandbox-checks
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.15"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.10"
          python-version: "3.12.15"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Check env imports under the dedicated scoring identity
        run: |
          sudo env RUN_EPISODE_LIVE=1 \
            EPISODE_LIVE_IMAGE=registry.example/task@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            "$PWD/.venv/bin/python" -m pytest -q \
            tests/test_bridge_live.py::test_the_live_envs_import_as_a_scoring_uid
      - name: Exercise the miner harness through a signed gateway
        env:
          RUN_VERIFIERS_BRIDGE: "1"
        run: uv run pytest -q tests/test_verifiers_bridge_live.py
      - name: Install the signed episode test host
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static xfsprogs
          sudo ./scripts/bootstrap-runtime.sh --configure-docker
          sudo ./scripts/test-xfs-docker.sh up
          sudo docker -H unix:///run/reliquary-xfs-docker.sock pull ubuntu:22.04
      - name: Exercise signed episodes with production resource controls
        id: signed_tests
        env:
          DOCKER_HOST: unix:///run/reliquary-xfs-docker.sock
        run: |
          sudo env \
            DOCKER_HOST="$DOCKER_HOST" \
            RUN_EPISODE_LIVE=1 \
            EPISODE_LIVE_XFS=1 \
            EPISODE_LIVE_DOCKER_PIDFILE=/run/reliquary-xfs-docker.pid \
            EPISODE_LIVE_CPU_SOURCE=cgroupfs \
            EPISODE_LIVE_BUSYBOX=/usr/bin/busybox \
            "$PWD/.venv/bin/python" -m pytest -q -m live --durations=10 \
            --junitxml="$RUNNER_TEMP/signed-episodes.xml" -o junit_logging=no -o junit_log_passing_tests=false \
            tests/test_episode_live.py \
            tests/test_episode_resources_live.py \
            tests/test_bridge_live.py
          python - "$RUNNER_TEMP/signed-episodes.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          suites = ElementTree.parse(sys.argv[1]).getroot().iter("testsuite")
          counts = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for suite in suites:
              for key in counts:
                  counts[key] += int(suite.get(key, 0))
          assert counts["tests"] > 0, counts
          assert not any(counts[key] for key in ("failures", "errors", "skipped")), counts
          PY
      - name: Repeat strict writable-root quota conformance
        env:
          DOCKER_HOST: unix:///run/reliquary-xfs-docker.sock
        run: |
          for pass in 1 2 3; do
            echo "Quota conformance pass $pass/3"
            sudo env \
              DOCKER_HOST="$DOCKER_HOST" \
              RUN_EPISODE_LIVE=1 \
              EPISODE_LIVE_XFS=1 \
              EPISODE_LIVE_DOCKER_PIDFILE=/run/reliquary-xfs-docker.pid \
              EPISODE_LIVE_CPU_SOURCE=cgroupfs \
              EPISODE_LIVE_BUSYBOX=/usr/bin/busybox \
              "$PWD/.venv/bin/python" -m pytest -q -m live --durations=10 \
              tests/test_episode_live.py::test_writable_root_is_capped_by_the_project_quota
          done
      - name: Stop the isolated test daemon
        if: always()
        working-directory: ${{ github.workspace }}
        run: sudo ./scripts/test-xfs-docker.sh purge
      - name: Retain test counts
        if: always()
        uses: ./.github/actions/test-summary
        with:
          junit-path: ${{ runner.temp }}/signed-episodes.xml
          test-outcome: ${{ steps.signed_tests.outcome }}

  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.15"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.10"
          python-version: "3.12.15"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv pip install --no-deps --editable harness
      - run: uv pip install 'transformers==5.20.2'
      - name: Fetch pinned tokenizer assets
        run: |
          mkdir -p "$RUNNER_TEMP/tokenizers/qwen38" "$RUNNER_TEMP/tokenizers/teutonic"
          curl --fail --location --proto "=https" --max-time 60 --max-filesize 33554432 --output "$RUNNER_TEMP/tokenizers/qwen38/tokenizer.json" "https://huggingface.co/Qwen/Qwen3.8-27B/resolve/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/tokenizer.json"
          echo "0997f410c57a1f4e53b09e4be8f4a172d90edd9564368fb0847030937229b9f3  $RUNNER_TEMP/tokenizers/qwen38/tokenizer.json" | sha256sum -c -
          curl --fail --location --proto "=https" --max-time 60 --max-filesize 33554432 --output "$RUNNER_TEMP/tokenizers/qwen38/tokenizer_config.json" "https://huggingface.co/Qwen/Qwen3.8-27B/resolve/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/tokenizer_config.json"
          echo "b11349aafa7cdc6a320767cf7ceb29ed82f7eda5d65e8e0819e76f0ce947bf27  $RUNNER_TEMP/tokenizers/qwen38/tokenizer_config.json" | sha256sum -c -
          curl --fail --location --proto "=https" --max-time 60 --max-filesize 33554432 --output "$RUNNER_TEMP/tokenizers/teutonic/tokenizer.json" "https://huggingface.co/ReliquaryForge/teutonic-i-graft-sft-cot-v2/resolve/d5256c5ccc2c06d8f9bf3133b37ab2a5b95a224e/tokenizer.json"
          echo "fe000e3ed39ed12b8d2481d527d44f93c65d37e87645d2dcc80d1bf9d50d2927  $RUNNER_TEMP/tokenizers/teutonic/tokenizer.json" | sha256sum -c -
          curl --fail --location --proto "=https" --max-time 60 --max-filesize 33554432 --output "$RUNNER_TEMP/tokenizers/teutonic/tokenizer_config.json" "https://huggingface.co/ReliquaryForge/teutonic-i-graft-sft-cot-v2/resolve/d5256c5ccc2c06d8f9bf3133b37ab2a5b95a224e/tokenizer_config.json"
          echo "85872dac6c375bb5ef7fb4ff1c5f84eb9ecb2db343d5291925beff696dfb8867  $RUNNER_TEMP/tokenizers/teutonic/tokenizer_config.json" | sha256sum -c -
      - name: Require both recorded tokenizers
        env:
          RELIQUARY_HARNESS_TOKENIZERS: ${{ runner.temp }}/tokenizers/qwen38:${{ runner.temp }}/tokenizers/teutonic
          PYTHONPATH: harness/tests
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --no-sync python -c 'from test_qwen_goldens import TOKENIZERS; assert set(TOKENIZERS) == {"422fa18269c6e298", "cd79c4a4fa1a9867"}, TOKENIZERS'
      - id: unit_tests
        env:
          RELIQUARY_HARNESS_TOKENIZERS: ${{ runner.temp }}/tokenizers/qwen38:${{ runner.temp }}/tokenizers/teutonic
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --no-sync pytest -q harness/tests --junitxml="${{ runner.temp }}/pytest-results.xml" -o junit_logging=no -o junit_log_passing_tests=false
      - run: uv build --project harness --out-dir "$RUNNER_TEMP/harness-dist"
      - name: Retain test counts
        if: always()
        uses: ./.github/actions/test-summary
        with:
          junit-path: ${{ runner.temp }}/pytest-results.xml
          test-outcome: ${{ steps.unit_tests.outcome }}

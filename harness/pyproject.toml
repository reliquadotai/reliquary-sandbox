[project]
name = "reliquary-harness"
version = "0.1.0"
description = "Agentic harness specs and the pure render/parse/loop code miners, validators and gateways share"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
[project.optional-dependencies]
# The Qwen3.8 renderer the bash-vf-b2e4e81 spec renders with (and its engine client).
qwen = ["renderers==0.1.11"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "renderers[transformers]==0.1.11"]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/reliquary_harness"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
